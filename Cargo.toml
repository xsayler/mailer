[package]
name = "mailer"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }

# Mail protocols
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# HTML rendering
webkit6 = "0.4"

# Email parsing
mail-parser = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keyring
oo7 = { version = "0.6", features = ["tokio"] }

# Cache
lru = "0.12"
bincode = "1"

# HTML sanitization
ammonia = "4"

# Draft IDs
uuid = { version = "1", features = ["v4"] }

# Misc
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
